<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podstawowy formularz</title>
</head>
<body>
    <h1>Podstawowy formularz</h1>
    <form method="POST">
        <input type="text" name="fullname" placeholder="Imie i Nazwisko">
        <button type="submit">Wyslij</button>
    </form>
    {% if erorr %}
    <h2 style="color: red;">Blad: {{erorr}}</h2>
    {% endif%}
    {% if fullname %}
    <h2 style="color: blue;"> imie i nazwisko: {{fullname}}</h2>
    {% endif%}
</body>
</html>
